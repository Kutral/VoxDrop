[package]
name = "tauri-appvoxdrop"
version = "0.0.15"
description = "Hold a hotkey, speak, release: polished text at your cursor"
authors = ["Kutraleeswaran B"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_appvoxdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-single-instance = "2"
cpal = "0.15"
hound = "3.5"

[target.'cfg(not(windows))'.dependencies]
enigo = "0.1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
windows = { version = "0.58.0", features = ["Foundation", "Media_Control"] }

# Smaller, faster binary: the app idles in the tray all day, so startup and
# resident size matter more than build time.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
